[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pcb-place"
version = "0.13.0"
description = "Deterministic footprint placement and heuristic planning sidecars for KiCad PCB files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Patrick McCarty" }]
keywords = ["kicad", "pcb", "eda", "placement", "hardware"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pcb-place = "pcb_place:main"
pcb-plan = "pcb_plan:main"


[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/src",
  "/pyproject.toml",
  "/examples",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pcb_place", "src/pcb_plan"]


[tool.pytest.ini_options]
testpaths = ["tests"]
